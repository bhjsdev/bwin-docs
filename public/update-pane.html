<html>
  <head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bwin@latest/dist/bwin.css" />
    <link rel="stylesheet" href="iframe-theme.css" />
    <script src="iframe-theme.js"></script>
    <script type="module">
      import { BinaryWindow } from 'https://cdn.jsdelivr.net/npm/bwin@latest/dist/bwin.min.js';

      const bwin = new BinaryWindow({
        fitContainer: true,
        children: [
          { position: 'left', id: 'pane-1', content: 'Pane 1' },
          {
            position: 'right',
            id: 'pane-2',
            title: 'Pane 2',
            content: 'Pane 2',
          },
        ],
      });

      bwin.mount(document.getElementById('container'));

      document.getElementById('update-pane').addEventListener('click', () => {
        bwin.updatePane('pane-2', {
          title: 'Updated',
          content: Object.assign(document.createElement('em'), { innerHTML: 'Updated content' }),
        });
      });
    </script>
  </head>
  <body style="margin: 0">
    <button id="update-pane">Update a pane</button>
    <div id="container" style="width: 400px; height: 260px"></div>
  </body>
</html>
